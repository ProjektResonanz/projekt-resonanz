<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Projekt Resonanz – Impressum</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: linear-gradient(160deg, #e8f3e8 0%, #d4e8d4 40%, #c9dfe2 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        .wrapper {
            width: 100%;
            max-width: 650px;
            display: flex;
            flex-direction: column;
            gap: 35px;
            padding: 20px 10px;
        }

        .message-card {
            background: rgba(255,255,255,0.7);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 30px 28px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.05);
            border: 1px solid rgba(255,255,255,0.8);
            line-height: 1.7;
            color: #2a3a2e;
            font-size: 16px;
        }
        .message-card h1 {
            font-size: 28px;
            color: #1d4a2c;
            margin-bottom: 20px;
        }
        .message-card p {
            margin-bottom: 14px;
        }
        .message-card strong {
            color: #1d4a2c;
        }

        .back-link {
            display: inline-block;
            margin-top: 10px;
            text-decoration: none;
            color: #198754;
            font-weight: 500;
            transition: color 0.2s;
        }
        .back-link:hover {
            color: #146c43;
        }
    </style>
</head>
<body>
    <div class="wrapper">
        <div class="message-card">
            <h1>Impressum</h1>
            <p><strong>Angaben gemäß § 5 TMG</strong></p>
            <p>
                Projekt Resonanz<br>
                Kevin Albrecht<br>
                Straße der Befreiung 1<br>
15324 Kienitz
            </p>
            <p><strong>Kontakt</strong></p>
            <p>
                E-Mail: projektresonanz@mailbox.org
            </p>
            <p><strong>Verantwortlich für den Inhalt nach § 55 Abs. 2 RStV</strong></p>
            <p>
                Kevin Albrecht<br>
                Straße der Befreiung 1<br>
15324 Kienitz
            </p>
            <a href="index.html" class="back-link">← Zurück zur Startseite</a>
        </div>
    </div>
</body>
</html>
