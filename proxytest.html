<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Proxy Test</title>
</head>
<body>
    <h1>Proxy Test</h1>
    <button onclick="test()">Test starten</button>
    <pre id="out"></pre>
    <script>
        async function test() {
            const out = document.getElementById('out');
            out.textContent = 'Sende...';
            try {
                // ⚠️ HIER DEINE RICHTIGE RENDER-URL EINTRAGEN ⚠️
                const res = await fetch('https://projekt-resonanz-proxy.onrender.com/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        model: 'deepseek-v4-pro',
                        messages: [{ role: 'user', content: 'Erkläre Mir grob wie eine pflanzenzelle aufgebaut ist.' }],
                        max_tokens: 1200
                    })
                });
                const data = await res.json();
                out.textContent = JSON.stringify(data, null, 2);
            } catch (e) {
                out.textContent = 'Fehler: ' + e.message;
            }
        }
    </script>
</body>
</html>
